# :see: https://peps.python.org/pep-0621/

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[dependency-groups]
dev = [
    "autohooks>=26,<27",
    "autohooks-plugin-black>=23,<24",
    "autohooks-plugin-ruff>=25,<26",
    "black>=26,<27",
    "django-stubs>=6,<7",
    # >=3.29 fixes an OSError on Docker/macOS volume mounts (fcntl file locking)
    "filelock>=3.29",
    "mypy>=2,<3",
    "pytest>=9,<10",
    "pytest-django>=4,<5",
    "tox>=4,<5",
]

[project]
name = "phx-filters-django"
version = "4.0.0"
description = "Extends phx-filters, adding filters useful for Django applications."
readme = "README.rst"
requires-python = ">= 3.12"
license = { file = "LICENCE" }
authors = [
    { name = "Phoenix Zerin", email = "phx@phx.nz" }
]

keywords = [
    "data validation",
    "django",
    "filters",
    "extension filters",
]

classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    'Topic :: Text Processing :: Filters',
]

dependencies = [
    "Django >= 5.2",
    # 4.0 is the first release whose BaseFilter is typed (py.typed, generic
    # over its output type).
    "phx-filters >= 4.0.0a2",
]

# https://filters.readthedocs.io/en/latest/extensions.html#registering-your-filters
[project.entry-points."filters.extensions"]
Model = "filters_django:Model"

[project.urls]
Documentation = "https://filters.readthedocs.io/en/latest/extension_filters.html#django-filters"
Changelog = "https://github.com/todofixthis/filters-django/releases"
Issues = "https://github.com/todofixthis/filters-django/issues"
Repository = "https://github.com/todofixthis/filters-django"

[tool.autohooks]
mode = "pythonpath"
pre-commit = [
    "autohooks.plugins.black",
    "autohooks.plugins.ruff",
]

[tool.django-stubs]
# The test app's settings, which the django-stubs mypy plugin loads to type
# its models.
django_settings_module = "django_test_project.settings"

[tool.hatch.build.targets.wheel]
packages = ["src/filters_django"]

[tool.mypy]
plugins = ["mypy_django_plugin.main"]
strict = true

# phx-filters rejects a value by returning `_invalid_value()`'s result (`Any`,
# `None` by default) from a non-Optional `_apply`. Re-enable both codes once
# todofixthis/filters#121 makes rejection raise instead.
[[tool.mypy.overrides]]
module = ["filters_django"]
disable_error_code = ["no-any-return", "return-value"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "django_test_project.settings"
pythonpath = ["."]
testpaths = ["test"]

[tool.ruff.lint]
# phx-filters' BaseFilter declares `templates` as an instance attribute, so a
# subclass annotating it `ClassVar`, as RUF012 asks, fails mypy's override
# check.
ignore = ["RUF012"]

[tool.tox]
env_list = ["py312", "py313", "py314"]

[tool.tox.env_run_base]
allowlist_externals = ["pytest"]
commands = [["pytest"]]

[tool.uv]
keyring-provider = "subprocess"
# Fix SSL errors when running in Leash containers
system-certs = true
