# https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python
name: CI
on:
  push: ~
permissions:
  contents: read

jobs:
  # The phx plugin's hooks check ADRs in Claude Code sessions but never block, so
  # this is the only blocking ADR check, and the only check at all for a commit
  # made outside a session with the plugin (ADR 001 forbids a repo-local copy of
  # the tool). AGENTS.md reads the pinned ref from this job.
  adrs:
    runs-on: ubuntu-latest

    steps:
      - name: Clone repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Check ADRs
        # phx-claude-siat 8.1.0, pinned to that tag's commit. A renovate.json
        # custom manager bumps both, and AGENTS.md reads the ref: keep this comment
        # opening `# phx-claude-siat <version>`, only comments between it and
        # `run:`, and the run line on one line with the full 40-hex commit.
        run: uvx --from 'git+https://github.com/todofixthis/phx-claude-siat@0725567cec6bab6a227c2a3d569e64c226c33a4e#subdirectory=skills/writing-adrs' phx-adr check

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version:
          # Note: Use quotes to avoid float cast - especially important if the
          # version number ends with 0!
          - "3.12"
          - "3.13"
          - "3.14"

    steps:
      - name: Clone repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync
      - name: Run tests
        run: uv run pytest
